<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>This week at Launchpad23</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1c4587; --navy-dark:#12305f; --slate:#647da5; --ink:#2b2f36; --text:#414141; --muted:#6b7080;
  --line:#e3e7ef; --soft:#f4f6fa; --warm:#fff7e8; --accent:#f2a33a; --sky:#dfe9f8;
  --font:Montserrat,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--soft);color:var(--text);font-family:var(--font);font-size:17px;line-height:1.65}
a{color:var(--navy);text-underline-offset:3px}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:6px}
img{max-width:100%;display:block}
.wrap{max-width:1004px;margin:0 auto;padding:0 20px}
h1,h2,h3{color:var(--navy);line-height:1.2;margin:0 0 .5em;font-weight:700}
h1{font-size:clamp(2rem,4.5vw,3rem);font-weight:800;letter-spacing:-.01em}
.panel{container-type:inline-size}
.week-title{font-size:min(4.5rem,6cqi)!important;white-space:nowrap;text-align:center;line-height:1.1;margin:4px 0 24px}
h2{font-size:clamp(1.4rem,3vw,1.9rem)} h3{font-size:1.15rem}

/* header and footer */
.top{background:#fff;border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--navy);font-weight:700;font-size:1.3rem}
.brand b{color:var(--accent)}
.top nav a{margin-left:18px;font-weight:600;font-size:.95rem;text-decoration:none}
.top nav a:hover{text-decoration:underline}
footer{color:var(--muted);font-size:.9rem;padding:36px 0;text-align:center}

/* page */
.page{padding:36px 0 40px}
.panel{background:#fff;border-radius:16px;padding:28px;margin:0 0 28px;box-shadow:0 6px 24px rgba(18,48,95,.08)}
.date{font-weight:600;color:var(--slate);margin:0 0 4px}
.panel > h2{margin-bottom:.6em}
.sched{background:var(--sky);border-left:5px solid var(--navy);border-radius:0 10px 10px 0;margin:16px 0;padding:12px 18px 12px 38px}
.sched li{padding:3px 0}
.sched li::marker{color:var(--navy)}
.notes{background:var(--warm);border-radius:10px;padding:12px 16px;margin:16px 0}
.notes p{margin:0}
.btn{display:inline-flex;align-items:center;gap:10px;font-family:var(--font);font-weight:700;font-size:1rem;border:0;border-radius:999px;padding:13px 24px;cursor:pointer;text-decoration:none}
.btn-main{background:var(--navy);color:#fff}
.btn-main:hover{background:var(--navy-dark)}
.btn-line{background:#fff;color:var(--navy);border:2px solid var(--navy)}
.btn[disabled]{opacity:.6;cursor:default}
.btn-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px}
.small{font-size:.95rem;color:var(--muted)}

/* clubs */
.clubs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px;margin-top:8px}
.club{border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px;background:#fff}
.club .pic{aspect-ratio:1/1;border-radius:10px;overflow:hidden;background:var(--soft)}
.club .pic img,.club .pic svg{width:100%;height:100%;object-fit:cover;display:block}
.club h3{margin:6px 0 0}
.club p{margin:0}
.club .go{font-weight:700}
.club .this{background:var(--soft);border-radius:8px;padding:8px 12px}
details{border-top:1px solid var(--line);padding-top:8px}
details summary{cursor:pointer;font-weight:700;color:var(--navy)}
details .inside{padding-top:8px;font-size:.95rem}
details .inside a{word-break:break-all}

/* spinner dial */
.spin-hero{text-align:center}
.dial{margin:22px auto;width:min(260px,70vw);aspect-ratio:1;border-radius:50%;background:var(--navy);border:10px solid var(--accent);display:flex;align-items:center;justify-content:center;position:relative}
.dial span{font-weight:800;font-size:clamp(4.5rem,18vw,6.5rem);color:#fff;font-variant-numeric:tabular-nums;position:relative;z-index:1}
.dial .face{position:absolute;inset:0;border-radius:50%;overflow:hidden}
.dial .face img{width:100%;height:100%;object-fit:cover;display:block}
.dial.has-face span{position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);font-size:1.6rem!important;background:var(--accent);color:var(--navy);border-radius:999px;padding:2px 16px;line-height:1.4}
.lengths{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:8px 0 4px}
.lengths button{font-family:var(--font);font-weight:700;border:2px solid var(--navy);background:#fff;color:var(--navy);border-radius:999px;padding:9px 18px;cursor:pointer}
.lengths button[aria-pressed="true"]{background:var(--navy);color:#fff}
.lengths small{display:block;font-weight:500;font-size:1rem}
.version{background:var(--soft);border-radius:8px;padding:8px 12px;margin:0 0 14px}
.dial .tick{position:absolute;top:-22px;left:50%;transform:translateX(-50%);border-left:15px solid transparent;border-right:15px solid transparent;border-top:22px solid var(--accent)}

/* quote card */
.card{background:#fff;border-radius:18px;overflow:hidden;max-width:820px;margin:24px auto;text-align:left;box-shadow:0 6px 24px rgba(18,48,95,.10)}
.card-head{display:flex;gap:20px;align-items:center;padding:22px 28px;background:var(--sky)}
.head-img{flex:0 0 120px;width:120px;height:120px;border-radius:12px;overflow:hidden;background:#fff}
.head-img img{width:100%;height:100%;object-fit:cover}
.card-head h2{margin:0}
.by{margin-top:4px;color:var(--ink)}
.portrait figcaption{font-size:.75rem;color:var(--muted);padding:6px 4px}
.mono{float:right;width:110px;height:110px;margin:0 0 14px 22px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:2.4rem}
.card-body{padding:24px 28px}
.readaloud{background:var(--warm);border-left:6px solid var(--accent);border-radius:0 14px 14px 0;padding:18px 24px 20px;margin:0 0 8px}
.readlabel{font-size:.85rem;font-weight:700;color:var(--navy);margin:0 0 6px}
.passage{font-size:1.3rem;line-height:1.75;white-space:pre-line;color:#1b1c2e;font-weight:500;margin:0}
.passage.poem{white-space:normal}
.passage .ln{display:block;padding-left:1.6em;text-indent:-1.6em}
.passage .gap{display:block;height:.9em}
.passage .qm{color:var(--accent);font-weight:800;font-size:1.6em;line-height:0;vertical-align:-.25em}
.passage .qo{margin-right:.22em}
.passage .qc{margin-left:.18em}
.about{margin-top:26px;padding-top:2px;border-top:1px solid var(--line)}
.about p{margin:0 0 10px}
.about .note{font-size:.9rem}
.orig{font-size:1.05rem;line-height:1.7;white-space:pre-line;color:var(--navy);margin:0 0 16px;font-style:italic}
.langlabel{font-size:.85rem;color:var(--muted);margin:0 0 4px;font-weight:600}
.card-body h3{margin:22px 0 10px;font-size:1.1rem;color:var(--navy)}
.defs{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.defs li{background:var(--soft);border-radius:8px;padding:8px 12px}
.note{font-size:.9rem;color:var(--muted);margin-top:18px}

/* lists */
.qlist{list-style:none;padding:0;margin:16px 0}
.qlist li{display:grid;grid-template-columns:64px 1fr;gap:16px;padding:16px 0;border-bottom:1px solid var(--line)}
.qlist .n{font-weight:800;font-size:1.8rem;color:var(--navy)}
.qlist .t{white-space:pre-line;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;color:var(--ink)}
.qlist .who{color:var(--muted);font-size:.92rem;margin:6px 0}
.games{list-style:none;padding:0;margin:0}
.games li{padding:14px 0;border-bottom:1px solid var(--line)}
.games .tab{font-size:.88rem;color:var(--muted)}

/* reels */
.prompt{font-size:1.35rem;line-height:1.5;color:var(--ink);font-weight:600;margin:6px 0 0}
.reels{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:18px 0}
.reel{border:2px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;text-align:left;font-family:var(--font);cursor:pointer;min-height:96px}
.reel .lab{display:block;font-size:.8rem;font-weight:700;color:var(--slate)}
.reel .val{display:block;font-size:1.05rem;font-weight:600;color:var(--ink);margin-top:4px}
.reel.held{border-color:var(--accent);background:var(--warm)}
.reel.held .lab::after{content:" (kept)"}
.topic{font-size:1.5rem;font-weight:700;color:var(--navy);margin:4px 0 8px}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.side{border-radius:12px;padding:14px;text-align:center;font-weight:700;font-size:1.1rem}
.side.for{background:#e3f4ea;color:#1d6b3f} .side.against{background:#fde8e6;color:#9b2c22}
.timer{font-weight:800;font-size:2.4rem;color:var(--navy);font-variant-numeric:tabular-nums}
.msg{background:#fff;border:2px dashed var(--line);border-radius:12px;padding:18px;margin:20px 0}
/* Wednesday page sections */
.title-card{background:var(--navy);color:#fff;border-radius:16px;padding:24px 28px;margin:0 0 28px;text-align:center;container-type:inline-size;box-shadow:0 6px 24px rgba(18,48,95,.12)}
.title-card .week-title{color:#fff;margin:0}
.title-card p{margin:0;color:#dfe9f8;font-weight:600}
.sec{margin:0 0 16px}
.cv{display:grid;gap:18px}
.cv-card{display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:start;border:1px solid var(--line);border-radius:14px;padding:16px}
.cv-card .sq{aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:var(--soft)}
.cv-card .sq img,.cv-card .sq svg{width:100%;height:100%;object-fit:cover;display:block}
.cv-card h3{margin:2px 0 8px}.cv-card p{margin:0}
.cv-card .btn-row{margin-top:12px}
.ann{margin:0;padding-left:20px}.ann li{padding:3px 0}
.cs{display:grid;gap:18px}
.cs-card{border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;grid-template-columns:360px 1fr;gap:20px;align-items:start}
.cs-card .txt{display:flex;flex-direction:column;gap:8px}
@media (max-width:760px){.cs-card{grid-template-columns:1fr;gap:12px}}
.cs-card .wide{aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:var(--soft)}
.cs-card .wide img{width:100%;height:100%;object-fit:cover}
.cs-card h3{margin:2px 0 0}.cs-card p{margin:0}
.cs-card .host{font-weight:700;color:var(--slate)}
.debrief{text-align:center}
.db-img{max-width:420px;width:100%;margin:0 auto 8px}
.final{max-width:720px;margin:28px auto 0;background:var(--warm);border-left:6px solid var(--accent);border-radius:0 14px 14px 0;padding:18px 24px;text-align:left}
.final-label{font-weight:700;color:var(--navy);margin:0 0 6px}
.final blockquote{margin:0;font-size:1.1rem;line-height:1.7;color:#1b1c2e}
.final figcaption{margin-top:10px;color:var(--muted)}
@media (max-width:700px){.cv-card{grid-template-columns:1fr;gap:12px}}
/* Wednesday: topics, exit tickets, 10x10 */
.launches{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px;margin-top:8px}
.launch{border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px}
.launch .pic{aspect-ratio:1/1;border-radius:10px;overflow:hidden;background:var(--soft)}
.launch .pic img{width:100%;height:100%;object-fit:cover}
.launch h3{margin:4px 0 0}.launch p{margin:0}
.launch .btn-row{margin-top:auto;padding-top:8px}
.x-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.x-clock{font-weight:800;font-size:3rem!important;color:var(--navy);font-variant-numeric:tabular-nums;line-height:1}
.x-clock.low{color:#c0392b}
.x-status{font-weight:700;color:var(--slate)}
.x-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px;margin-top:16px}
.x-card{border:2px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;background:#fff}
.x-card.done{border-color:#2e9d5b}
.x-card.full{border-color:var(--accent)}
.x-slot{font-size:.85rem!important;font-weight:700;color:var(--slate);margin:0}
.x-card h3{margin:0}
.x-count{font-weight:800;color:var(--navy)}
.x-bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden}
.x-bar span{display:block;height:100%;background:var(--navy);border-radius:99px}
.x-card.done .x-bar span{background:#2e9d5b}
.x-facts{margin:0;padding-left:1.5em;font-size:.95rem!important}
.x-facts li{padding:2px 0}
.x-facts .who{color:var(--muted);font-size:.85rem}
.x-facts li.extra{color:var(--muted)}
.x-card .btn{align-self:flex-start;padding:9px 18px}
.x-teams{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0}
.x-teams button{font-family:var(--font);font-weight:700;border:2px solid var(--navy);background:#fff;color:var(--navy);border-radius:999px;padding:7px 16px;cursor:pointer}
.x-teams button[aria-pressed="true"]{background:var(--navy);color:#fff}
.x-rules li{padding:2px 0}
.v{display:inline-block;font-weight:700;font-size:.8rem;border-radius:999px;padding:1px 9px;margin-right:6px;white-space:nowrap}
.v-ok{background:#e3f4ea;color:#1d6b3f}.v-bad{background:#fde8e6;color:#9b2c22}.v-zero{background:var(--soft);color:var(--muted)}.v-wait{background:var(--warm);color:#8a5a00}
.x-fix{display:block;font-size:.88rem;color:#9b2c22;margin:2px 0 4px}
.x-score{font-weight:800;font-size:1.6rem!important;color:var(--navy)}
.x-total{display:flex;flex-wrap:wrap;gap:24px;margin-top:12px}
.x-total[hidden]{display:none}
.x-total div{background:var(--soft);border-radius:12px;padding:12px 18px}
.x-total b{display:block;font-size:2rem!important;color:var(--navy);line-height:1.1}
@media (max-width:700px){
  .panel{padding:20px}
  .card-head{padding:18px 20px;gap:14px}
  .head-img{flex-basis:84px;width:84px;height:84px}
  .card-body{padding:20px}
  .mono{width:64px;height:64px;font-size:1.4rem;margin:0 0 10px 14px}
  .passage{font-size:1.12rem}
  .top nav a{margin:0 16px 0 0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Two text sizes only: titles and text */
:root{--title:1.45rem;--text:18px}
html{font-size:var(--text)}
h1,h2,h3,.topic,.qlist .n,.card-head h2,.panel > h2,.club h3{font-size:var(--title)!important}
.passage,.small,.note,.by,.date,.langlabel,.readlabel,.defs li,.about,.about .note,.games .tab,.reel .lab,.reel .val,.prompt,.orig,.side,footer,details .inside,.btn,.sched,.notes,.qlist .who,.qlist .t,.games li{font-size:1rem!important}
@media (max-width:700px){:root{--title:1.3rem;--text:17px}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="#/"><img src="../img/logo.svg" alt="" width="44" height="44"><span>Launchpad<b>23</b></span></a>
</div></header>
<main id="app" tabindex="-1"><div class="wrap page"><p>Loading…</p></div></main>
<footer><div class="wrap">© <span id="yr">2026</span> Launchpad23, Inc. All rights reserved.</div></footer>

<script>
/* ===== Settings ===== */
const SHEET_ID = "1k-s0e-_88iBPJo0j93sIPkA0DlT-gK7n6X1gj1JmMzA";
const IMAGE_FOLDER = "../ghana/images/";
/* This file is used for two pages: /ghana/ (Tuesday public speaking) and /connect/ (Wednesday Connect). */
const MODE = /\/connect\/?/.test(location.pathname) ? "connect" : "speaking";
if(MODE==="connect") document.title="This Week at Launchpad23";
const STORE_KEY = "lp23-ghana-myquote";
document.getElementById("yr").textContent = new Date().getFullYear();

/* ===== Data ===== */
function parseCSV(text){
  const rows=[];let row=[],f="",q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){ if(c=='"'){ if(text[i+1]=='"'){f+='"';i++} else q=false } else f+=c }
    else if(c=='"') q=true;
    else if(c==','){row.push(f);f=""}
    else if(c=='\n'){row.push(f);rows.push(row);row=[];f=""}
    else if(c!='\r') f+=c;
  }
  if(f!==""||row.length){row.push(f);rows.push(row)}
  const head=(rows.shift()||[]).map(h=>h.trim());
  return rows.map(r=>Object.fromEntries(head.map((h,i)=>[h,(r[i]||"").trim()])));
}
async function tab(name){
  const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&headers=1&sheet=${encodeURIComponent(name)}`;
  const r=await fetch(url); if(!r.ok) throw new Error(name);
  return parseCSV(await r.text());
}
const shown=r=>(r["Show"]||"Yes").toLowerCase()!=="no";
let DATA=null;
async function load(){
  if(DATA) return DATA;
  const names=["Quotes","Schedule","This Week","Clubs","Games","Debate Topics","Reels","Speaking Archive","Art Challenges"];
  const res=await Promise.all(names.map(n=>tab(n).catch(()=>[])));
  const reels={}; res[6].forEach(r=>Object.entries(r).forEach(([k,v])=>{ if(!k) return; (reels[k]=reels[k]||[]); if(v) reels[k].push(v); }));
  DATA={quotes:res[0].filter(q=>q["Passage"]&&shown(q)&&q["Number"]),schedule:res[1].filter(s=>s["Session"]&&shown(s)),
        week:res[2],clubs:res[3].filter(c=>c["Name"]),games:res[4].filter(g=>g["Game"]&&g["Link"]),
        topics:res[5].filter(t=>t["Topic"]&&shown(t)),reels,archive:res[7],art:res[8]};
  return DATA;
}
/* Wednesday data: always read fresh (the 10x10 board polls it). */
async function freshTab(name){
  const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&headers=1&sheet=${encodeURIComponent(name)}&_=${Date.now()}`;
  const r=await fetch(url,{cache:"no-store"}); if(!r.ok) throw new Error(name);
  return parseCSV(await r.text());
}
async function loadWed(){
  const [s,topics,x,facts,news]=await Promise.all(["Wednesday Settings","Wednesday Topics","10x10 This Week","10x10 Facts","Announcements"].map(n=>freshTab(n).catch(()=>[])));
  const set={}; s.forEach(r=>{ const k=r["Setting (don't change)"]; if(k) set[k]=(r["Value"]||"").trim(); });
  return {set,topics:topics.filter(t=>t["Topic"]&&shown(t)),x:x.filter(t=>t["Topic"]),facts,news:news.filter(shown)};
}
function formLink(base,vals){ let u=base||""; Object.entries(vals).forEach(([k,v])=>{ u=u.replace("="+k,"="+encodeURIComponent(v)); }); return u; }

/* Times: the sheet is set to Eastern Time. */
const TZ="America/New_York";
function tzOffset(ms){ const p=Object.fromEntries(new Intl.DateTimeFormat("en-US",{timeZone:TZ,hourCycle:"h23",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit"}).formatToParts(new Date(ms)).map(x=>[x.type,x.value])); return Date.UTC(+p.year,p.month-1,+p.day,+p.hour,+p.minute,+p.second)-ms; }
function fromET(y,mo,d,h,mi,s){ const g=Date.UTC(y,mo-1,d,h,mi,s||0); let t=g-tzOffset(g); return g-tzOffset(t); }
function todayET(){ const p=Object.fromEntries(new Intl.DateTimeFormat("en-US",{timeZone:TZ,year:"numeric",month:"numeric",day:"numeric"}).formatToParts(new Date()).map(x=>[x.type,x.value])); return [+p.year,+p.month,+p.day]; }
/* Reads "11/18/2026 10:25:00", "2026-11-18 10:25", "10:25 AM", "10:25:13"... A time with no date means today. */
function parseET(str){
  str=String(str||"").trim(); if(!str) return null;
  let y,mo,d; let m=str.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m){y=+m[1];mo=+m[2];d=+m[3];} else if((m=str.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/))){mo=+m[1];d=+m[2];y=+m[3];} else [y,mo,d]=todayET();
  const t=str.match(/(\d{1,2}):(\d{2})(?::(\d{2}))?\s*([ap]\.?m\.?)?/i); if(!t) return null;
  let h=+t[1]; const ap=(t[4]||"").toLowerCase(); if(ap.startsWith("p")&&h<12) h+=12; if(ap.startsWith("a")&&h===12) h=0;
  return fromET(y,mo,d,h,+t[2],+(t[3]||0));

function roundInfo(w){
  const start=parseET(w.set["10x10 round start"]); const mins=parseFloat(w.set["10x10 minutes"])||10;
  const max=parseInt(w.set["10x10 max facts per topic"])||12;
  const teams=(w.set["10x10 teams"]||"Launchpad23").split(",").map(s=>s.trim()).filter(Boolean);
  return {start,end:start?start+mins*60000:null,mins,max,teams,results:/^y/i.test(w.set["10x10 show results"]||"")};
}
/* Facts for this round, per topic, in the order they came in. */
function roundFacts(w,ri,team){
  const [y,mo,d]=todayET(); const dayStart=fromET(y,mo,d,0,0,0);
  const from=ri.start?ri.start-60000:dayStart;
  const rows=w.facts.map(f=>({f,t:parseET(f["Timestamp"])})).filter(o=>o.t&&o.t>=from&&norm(o.f["Team"])===norm(team)).sort((a,b)=>a.t-b.t);
  return w.x.map(x=>{
    const list=rows.filter(o=>norm(o.f["Topic"])===norm(x["Topic"])).map((o,i)=>({...o.f,_t:o.t,_late:ri.end&&o.t>ri.end+30000,_over:i>=ri.max}));
    return {slot:x["Slot"],topic:x["Topic"],list};
  });
}
function scoreTopic(list){
  let pts=0,ok=0,bad=0,zero=0,wait=0;
  list.forEach(f=>{ if(f._late||f._over){zero++;return;} const v=verdictOf(f);
    if(v==="confirmed"||v==="correct"){pts++;ok++;} else if(v==="wrong"){pts--;bad++;} else if(v){zero++;} else wait++; });
  return {score:Math.min(10,pts),ok,bad,zero,wait};
}
function chip(f){
  if(f._late) return `<span class="v v-zero">Too late · 0</span>`;
  if(f._over) return `<span class="v v-zero">Over the limit · 0</span>`;
  const v=verdictOf(f);
  if(v==="confirmed"||v==="correct") return `<span class="v v-ok">✓ +1</span>`;
  if(v==="wrong") return `<span class="v v-bad">✗ −1</span>`;
  if(v==="duplicate") return `<span class="v v-zero">Duplicate · 0</span>`;
  if(v==="negative") return `<span class="v v-zero">Negative · 0</span>`;
  if(v) return `<span class="v v-zero">${esc(f["Cousin Claude"])} · 0</span>`;
  return `<span class="v v-wait">Not checked yet</span>`;
}

      <div class="x-total" id="x-total" ${xOpen.size>=topics.length?"":"hidden"}><div><b>${tot}</b>points out of 100</div><div><b>${ok+bad?Math.round(100*ok/(ok+bad)):0}%</b>accuracy</div><div><b>${sub}</b>facts submitted</div></div>
      <div class="x-grid">${topics.map((t,i)=>{ const s=sc[i]; const open=xOpen.has(team+"|"+i);
        return `<article class="x-card ${open&&s.score>=10?"done":""}"><p class="x-slot">${esc(t.slot)}</p><h3>${esc(t.topic)}</h3>${open?`<div class="x-score">${s.score} / 10</div><ol class="x-facts">${t.list.map(f=>`<li>${chip(f)}${esc(f["Your fact"])}${f["Correction"]?`<span class="x-fix">${esc(f["Correction"])}</span>`:""}</li>`).join("")||"<li>No facts.</li>"}</ol>`:`<p>${t.list.length} fact${t.list.length===1?"":"s"} submitted</p><button class="btn btn-main" data-open="${i}">Reveal</button>`}</article>`; }).join("")}</div>`;
    } else {
      const status=!ri.start?`Waiting for the round to start…`:running?`Time left`:`Time's up! Cousin Claude is checking your facts.`;
      const total=topics.reduce((a,t)=>a+Math.min(10,t.list.filter(f=>!f._late).length),0);
      body=`<div class="x-head"><div><h1 style="margin:0">10x10 Challenge</h1><p class="x-status" style="margin:4px 0 0">${status}</p></div>${ri.start?`<div class="x-clock" id="x-clock">${mmss(ri.end-now)}</div>`:`<div class="x-clock">${ri.mins}:00</div>`}</div>
      ${teamBtns}<p style="margin:12px 0 0"><b>${total}</b> of 100 facts${ri.teams.length>1?` for team ${esc(team)}`:""}.</p>${rules}
      <div class="x-grid">${topics.map(t=>{ const n=t.list.length, c=Math.min(10,n), full=n>=ri.max;
        const add=running&&!full?`<a class="btn btn-main" target="_blank" rel="noopener" href="${esc(formLink(w.set["10x10 fact form"],{TOPIC:t.topic,TEAM:team}))}">Add a fact</a>`:"";
        return `<article class="x-card ${n>=10?"done":""} ${full?"full":""}"><p class="x-slot">${esc(t.slot)}</p><h3>${esc(t.topic)}</h3>
        <div><span class="x-count">${c} / 10</span>${n>10?` <span class="small">+ ${n-10} extra${n-10>1?"s":""}</span>`:""}${full?` <span class="small">· full</span>`:""}</div><div class="x-bar"><span style="width:${c*10}%"></span></div>
        ${n?`<ol class="x-facts">${t.list.map((f,i)=>`<li class="${i>=10?"extra":""}">${esc(f["Your fact"])}${f["First name (optional)"]?` <span class="who">(${esc(f["First name (optional)"])})</span>`:""}</li>`).join("")}</ol>`:""}${add}</article>`; }).join("")}</div>`;
    }
    const open=[...document.querySelectorAll("details[open]")].length>0;
    app.innerHTML=`<div class="wrap page" id="x-root"><section class="panel">${body}</section><a href="#/">Back to this week</a></div>`;
    if(open){ const dd=document.querySelector("#x-root details"); if(dd) dd.open=true; }
    document.querySelectorAll("[data-team]").forEach(b=>b.onclick=()=>{ try{localStorage.setItem(TEAM_KEY,b.dataset.team)}catch(e){} xLast=""; draw(); });
    document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{ xOpen.add(team+"|"+b.dataset.open); xLast=""; draw(); });
    const all=document.getElementById("x-all"); if(all) all.onclick=()=>{ topics.forEach((t,i)=>xOpen.add(team+"|"+i)); xLast=""; draw(); };
    clearInterval(xTimer);
    if(running) xTimer=setInterval(()=>{ const c=document.getElementById("x-clock"); if(!c){clearInterval(xTimer);return;} const left=ri.end-Date.now(); c.textContent=mmss(left); c.classList.toggle("low",left<60000); if(left<=0){ xLast=""; draw(); } },500);
  };
  await draw();
  xPoll=setInterval(()=>{ if(!document.getElementById("x-root")){ stopBoard(); return; } draw(); },10000);
}

/* ===== Quotes ===== */
const SHORT="Short version (up to 60 words)", SHORT_O="Short version, original language", LEN="Length (leave blank: automatic)";
const words=t=>String(t||"").replace(/…/g," ").split(/\s+/).filter(Boolean).length;
function lengthOf(q){ const o=(q[LEN]||"").toLowerCase(); if(["short","medium","long"].includes(o)) return o; const w=words(q["Passage"]); return w<=60?"short":w<=110?"medium":"long"; }
function pool(d,len){ if(len==="any") return d.quotes; if(len==="short") return d.quotes.filter(q=>q[SHORT]||lengthOf(q)==="short"); return d.quotes.filter(q=>lengthOf(q)===len); }
function cardHTML(q,version){
  const useShort=version==="short"&&!!q[SHORT];
  if(useShort) q=Object.assign({},q,{"Passage":q[SHORT],"Original text":q[SHORT_O]||""});
  const defs=lines(q["Helpful definitions (one per line)"]).map(s=>{const i=s.indexOf(":");return i>0?`<li><b>${esc(s.slice(0,i))}</b>: ${esc(s.slice(i+1).trim())}</li>`:`<li>${esc(s)}</li>`}).join("");
  const img=q["Image"]?`<div class="head-img"><img src="${esc(imgSrc(q["Image"]))}" alt="" title="${esc(q["Image credit"]||"")}"></div>`:"";
  const lang=(q["Original language"]||"").toLowerCase();
  const orig=!!q["Original text"];
  return `<article class="card"><div class="card-head">${img}<div class="ttl"><h2>${esc(q["Number"])}. ${esc(q["Title"])}</h2><div class="by">${esc(q["Speaker"])}${q["Year"]?`, ${esc(q["Year"])}`:""}</div>${q["Where / from"]?`<div class="by small">${esc(q["Where / from"])}</div>`:""}</div></div>
  <div class="card-body">${useShort?`<p class="version">This is the short version. <a href="#/quote/${esc(q["Number"])}">See the full passage</a></p>`:""}${orig?`<p class="langlabel">In the original ${esc(q["Original language"]||"language")}</p><p class="orig" lang="${lang.startsWith("span")?"es":""}">${quoted(q["Original text"])}</p>`:""}<div class="readaloud"><p class="readlabel">Read this aloud${orig?" (in English)":""}</p>${passageHTML(q["Passage"])}</div>
  ${defs?`<h3>Helpful definitions</h3><ul class="defs">${defs}</ul>`:""}
  <div class="about">${q["Background"]?`<h3>The story behind it</h3><p>${esc(q["Background"])}</p>`:""}
  ${q["Image credit"]?`<p class="note">Picture: ${esc(q["Image credit"])}</p>`:""}${q["Source"]?`<p class="note">Source: <a href="${esc(q["Source"])}" target="_blank" rel="noopener">original text</a></p>`:""}</div></div></article>`;
}
async function quote(n,version){
  const d=await load(); const q=d.quotes.find(x=>x["Number"]===n);
  if(!q){ view(`<div class="wrap page"><div class="msg">There is no quote number ${esc(n)} yet. <a href="#/quotes">See all quotes</a>.</div></div>`); return; }
  view(`<div class="wrap page">${cardHTML(q,version)}<div class="btn-row" style="max-width:820px;margin:0 auto"><a class="btn btn-main" href="#/spin">Spin again</a><a class="btn btn-line" href="#/quotes">See all quotes</a></div></div>`);
}
let spinLen="any";
async function spin(){
  const d=await load();
  if(!d.quotes.length){ view(`<div class="wrap page"><div class="msg">No quotes yet.</div></div>`); return; }
  const opts=[["short","Short","about 30 seconds"],["medium","Medium","about 1 minute"],["long","Long","1 minute or more"],["any","Surprise me","any length"]];
  view(`<div class="wrap page"><div class="panel spin-hero"><h1>Spin for your quote</h1><p>Choose a length, then spin. Don't like your quote? Spin again.</p>
  <div class="lengths" role="group" aria-label="Length">${opts.map(([k,l,h])=>`<button data-len="${k}" aria-pressed="${k===spinLen}">${l}<small>${h}</small></button>`).join("")}</div>
  <div class="dial" id="dial" aria-live="polite"><div class="tick"></div><div class="face" id="face"></div><span id="dialnum">?</span></div>
  <button class="btn btn-main" id="go">Spin</button><p style="margin:14px 0 0"><a href="#/quotes">See all quotes</a></p></div><div id="result"></div></div>`);
  const btn=document.getElementById("go"), num=document.getElementById("dialnum"), face=document.getElementById("face"), dial=document.getElementById("dial");
  document.querySelectorAll(".lengths button").forEach(b=>b.onclick=()=>{spinLen=b.dataset.len;document.querySelectorAll(".lengths button").forEach(x=>x.setAttribute("aria-pressed",x===b));});
  // Load the pictures now, so they can flash past while spinning.
  const pics={}; d.quotes.forEach(q=>{ if(q["Image"]){ const im=new Image(); im.src=imgSrc(q["Image"]); pics[q["Number"]]=im.src; } });
  const show=q=>{ num.textContent=q["Number"]; const src=pics[q["Number"]]; dial.classList.toggle("has-face",!!src); face.innerHTML=src?`<img src="${src}" alt="">`:""; };
  btn.onclick=async()=>{
    const list=pool(d,spinLen); if(!list.length) return;
    btn.disabled=true; document.getElementById("result").innerHTML="";
    const pick=pickRandom(list); const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
    for(let t=1;t<(reduce?1:24);t++){ if(!document.getElementById("result")) return; show(pickRandom(list)); await sleep(40+t*t*0.5); }
    if(!document.getElementById("result")) return;
    show(pick); store(pick["Number"]); btn.disabled=false; btn.textContent="Spin again";
    const version=spinLen==="short"&&pick[SHORT]?"short":"";
    history.replaceState(null,"","#/quote/"+pick["Number"]+(version?"/short":""));
    document.getElementById("result").innerHTML=cardHTML(pick,version);
    document.querySelector("#result .card").scrollIntoView({behavior:reduce?"auto":"smooth",block:"start"});
  };
}
async function list(){
  const d=await load();
  view(`<div class="wrap page"><h1>All quotes</h1><p>Every quote has a number. Find yours, or pick any one to practice.</p>
  <div class="panel"><ul class="qlist">${d.quotes.map(q=>`<li><div class="n">${esc(q["Number"])}</div><div><div class="t">${esc(q["Passage"])}</div><div class="who">${esc(q["Speaker"])}${q["Year"]?`, ${esc(q["Year"])}`:""}</div><a href="#/quote/${esc(q["Number"])}">More information</a></div></li>`).join("")}</ul></div></div>`);
}

/* ===== Starter games ===== */
async function games(){
  const d=await load();
  view(`<div class="wrap page"><h1>Starter games</h1><div class="panel"><ul class="games">${d.games.map(g=>`<li><a href="${esc(g["Link"])}" target="_blank" rel="noopener"><b>${esc(g["Game"])}</b></a><br>${esc(g["What it is"])}${g["Works on a tablet?"]?`<div class="tab">Works on a tablet: ${esc(g["Works on a tablet?"])}</div>`:""}</li>`).join("")}</ul></div><a href="#/">Back to this week</a></div>`);
}

/* ===== Debate ===== */
function fillSubject(t,subject){ return t.replace(/\[(academic )?subject\]/i,subject); }
function topicHTML(t,subject){
  const defs=lines(t["Helpful definitions (one per line)"]).map(s=>{const i=s.indexOf(":");return i>0?`<li><b>${esc(s.slice(0,i))}</b>: ${esc(s.slice(i+1).trim())}</li>`:`<li>${esc(s)}</li>`}).join("");
  const qs=[t["Starting point 1"],t["Starting point 2"],"What would make you change your mind?"].filter(Boolean);
  return `<p class="topic">${esc(fillSubject(t["Topic"],subject))}</p>${t["Plain English"]?`<p><b>What it means:</b> ${esc(fillSubject(t["Plain English"],subject))}</p>`:""}
  ${defs?`<h3>Helpful definitions</h3><ul class="defs">${defs}</ul>`:""}
  <details style="margin-top:14px"><summary>Need a starting point?</summary><div class="inside"><ul>${qs.map(q=>`<li>${esc(q)}</li>`).join("")}</ul></div></details>`;
}
async function debate(){
  const d=await load(); const subjects=d.reels["Debate subjects"]||["Math"];
  const ov=override(d,"big-think");
  const weekly=ov?{"Topic":ov}:weeklyPick(d.topics,"debate");
  const wsub=weeklyPick(subjects,"subject");
  view(`<div class="wrap page"><h1>The Big Think</h1>
  <section class="panel"><p class="date">This week's topic</p>${weekly?topicHTML(weekly,wsub):`<p>No topics yet.</p>`}</section>
  <section class="panel"><h2>Spin a topic</h2><p>Debating with a partner? Spin for a topic, then flip to see who argues for it and who argues against it.</p>
  <div class="btn-row"><button class="btn btn-main" id="t-spin">Spin a topic</button></div><div id="t-out"></div></section></div>`);
  document.getElementById("t-spin").onclick=()=>{
    const t=pickRandom(d.topics), sub=pickRandom(subjects);
    document.getElementById("t-spin").textContent="Spin again";
    const out=document.getElementById("t-out");
    out.innerHTML=`<div style="margin-top:18px">${topicHTML(t,sub)}</div>
    <div class="btn-row"><button class="btn btn-line" id="flip">Flip for sides</button><button class="btn btn-line" id="solo">On your own? Argue both sides</button></div><div id="side-out"></div>`;
    document.getElementById("flip").onclick=()=>{
      const a=randomInt(2)===0;
      document.getElementById("side-out").innerHTML=`<div class="sides"><div class="side ${a?"for":"against"}">Speaker 1<br>${a?"For":"Against"}</div><div class="side ${a?"against":"for"}">Speaker 2<br>${a?"Against":"For"}</div></div><p class="small">"For" agrees with the topic. "Against" disagrees.</p>`;
    };
    document.getElementById("solo").onclick=()=>soloTimer();
  };
}
async function soloTimer(){
  const box=document.getElementById("side-out");
  box.innerHTML=`<div class="panel" style="margin-top:16px;text-align:center"><p id="solo-step" style="font-weight:700">First, argue <span style="color:#1d6b3f">FOR</span> the topic.</p><div class="timer" id="clock">1:00</div><button class="btn btn-main" id="solo-go">Start</button></div>`;
  document.getElementById("solo-go").onclick=async function(){
    this.disabled=true;
    for(const [label,color] of [["FOR","#1d6b3f"],["AGAINST","#9b2c22"]]){
      const step=document.getElementById("solo-step"); if(!step) return;
      step.innerHTML=`Now argue <span style="color:${color}">${label}</span> the topic.`;
      for(let s=60;s>=0;s--){ const c=document.getElementById("clock"); if(!c) return; c.textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`; if(s) await sleep(1000); }
    }
    const step=document.getElementById("solo-step"); if(step) step.textContent="Done! Which side was harder to argue?";
  };
}

/* ===== Art and writing generators ===== */
function generator(cfg){
  return async function(){
    const d=await load(); const lists=cfg.cols.map(c=>d.reels[c]||[]);
    const ov=override(d,cfg.key);
    const weekly=lists.map((l,i)=>weeklyPick(l,cfg.key+i));
    view(`<div class="wrap page"><h1>${cfg.title}</h1>
    <section class="panel"><p class="date">${cfg.weekLabel}</p><p class="prompt">${esc(ov||cfg.sentence(weekly))}</p></section>
    <section class="panel"><h2>${cfg.spinTitle}</h2><p>Tap a box to keep it, then spin to change the others.</p>
    <div class="reels">${cfg.cols.map((c,i)=>`<button class="reel" data-i="${i}" aria-pressed="false"><span class="lab">${esc(c.split(": ")[1]||c)}</span><span class="val">${esc(weekly[i])}</span></button>`).join("")}</div>
    <p class="prompt" id="sentence">${esc(cfg.sentence(weekly))}</p>
    <div class="btn-row"><button class="btn btn-main" id="r-spin">Spin</button></div></section>
    ${cfg.key==="art-club"&&d.art.some(a=>a["Challenge"])?`<a href="#/art-archive">Past art challenges</a>`:""}</div>`);
    const cur=[...weekly]; const reels=[...document.querySelectorAll(".reel")];
    reels.forEach(b=>b.onclick=()=>{const on=b.classList.toggle("held");b.setAttribute("aria-pressed",on)});
    document.getElementById("r-spin").onclick=async function(){
      this.disabled=true; const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
      for(let t=0;t<(reduce?1:12);t++){
        reels.forEach((b,i)=>{ if(!b.classList.contains("held")&&lists[i].length){ cur[i]=pickRandom(lists[i]); b.querySelector(".val").textContent=cur[i]; }});
        await sleep(60+t*12);
      }
      const s=document.getElementById("sentence"); if(s) s.textContent=cfg.sentence(cur); this.disabled=false;
    };
  };
}
const art=generator({key:"art-club",title:"Art Club",weekLabel:"This week's challenge",spinTitle:"Make your own challenge",
  cols:["Art: Something to draw","Art: The twist","Art: The mood"],
  sentence:v=>`Draw ${v[0]}, ${v[1]}. Make it feel ${v[2]}.`});
const writing=generator({key:"enchanted-quill",title:"Writing prompts",weekLabel:"This week's writing prompt",spinTitle:"Make your own prompt",
  cols:["Writing: A character","Writing: A place","Writing: A problem","Writing: Write it as"],
  sentence:v=>`Write about ${v[0]}, ${v[1]}, who ${v[2]}. Write it as ${v[3]}.`});
async function archive(kind){
  const d=await load(); const rows=(kind==="art"?d.art:d.archive).filter(r=>r[kind==="art"?"Challenge":"Title"]);
  view(`<div class="wrap page"><h1>${kind==="art"?"Past art challenges":"Past public speaking materials"}</h1><div class="panel">
  ${rows.length?`<ul class="qlist">${rows.map(r=>`<li><div class="n" style="font-size:1rem">${esc(r["Date"])}</div><div><b>${esc(r[kind==="art"?"Challenge":"Title"])}</b><p style="margin:4px 0">${esc(r["Description"])}</p>${r["Link"]?`<a href="${esc(r["Link"])}" target="_blank" rel="noopener">Open</a>`:""}</div></li>`).join("")}</ul>`:`<p>Nothing here yet.</p>`}</div><a href="#/">Back to this week</a></div>`);
}

/* ===== Routes ===== */
async function route(){
  const h=location.hash.replace(/^#\/?/,""); const p=h.split("/");
  stopBoard();
  try{
    if(p[0]==="10x10") await board();
    else if(p[0]==="quote") await quote(p[1],p[2]);
    else if(p[0]==="spin") await spin();
    else if(p[0]==="quotes") await list();
    else if(p[0]==="games") await games();
    else if(p[0]==="debate") await debate();
    else if(p[0]==="art") await art();
    else if(p[0]==="writing") await writing();
    else if(p[0]==="art-archive") await archive("art");
    else if(p[0]==="archive") await archive("speaking");
    else await home();
  }catch(e){ console.error(e); view(`<div class="wrap page"><div class="msg">The page could not load its content. Check your internet connection, then refresh the page.</div></div>`); }
  app.focus({preventScroll:true});
}
addEventListener("hashchange",route); route();
</script>
