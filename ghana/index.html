<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Launchpad23 · Ghana</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --night:#1D2155; --night-2:#2B3077; --paper:#FBFAF6; --ink:#1B1C2E; --muted:#5B5E78;
  --sun:#FFC93C; --sky:#BFE6FF; --teal:#0B8A8F; --line:#E3E1EE;
  --display:"Fredoka",system-ui,sans-serif; --body:"Atkinson Hyperlegible",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.55}
a{color:var(--teal);text-underline-offset:3px}
a:focus-visible,button:focus-visible{outline:3px solid var(--sun);outline-offset:3px;border-radius:6px}
img{max-width:100%;display:block}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0 0 .4em;font-weight:600}
h1{font-size:clamp(2rem,6vw,3.4rem)} h2{font-size:clamp(1.5rem,3.6vw,2.1rem)} h3{font-size:1.3rem}

/* top bar */
.top{background:var(--night);color:#fff}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:14px;padding-bottom:14px}
.brand{font-family:var(--display);font-weight:600;font-size:1.2rem;color:#fff;text-decoration:none;display:flex;align-items:center;gap:10px}
.top nav a{color:#fff;margin-left:16px;font-size:.95rem}

/* hero */
.hero{background:var(--night);color:#fff;padding:28px 0 64px;position:relative;overflow:hidden}
.hero p{max-width:34em;color:var(--sky);font-size:1.1rem}
.stars{position:absolute;inset:0;pointer-events:none;opacity:.55}

/* speaking block */
.speak{background:#fff;border-radius:22px;margin-top:-40px;position:relative;padding:28px;box-shadow:0 2px 0 var(--line)}
.speak-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:28px;align-items:start}
.week{background:var(--paper);border-left:6px solid var(--sun);padding:14px 18px;border-radius:0 12px 12px 0}
.week b{display:block;font-family:var(--display);font-weight:600}
.btn{display:inline-flex;align-items:center;gap:10px;font-family:var(--display);font-weight:600;font-size:1.15rem;border:0;border-radius:999px;padding:14px 26px;cursor:pointer;text-decoration:none}
.btn-sun{background:var(--sun);color:var(--night)}
.btn-ghost{background:transparent;color:var(--night);border:2px solid var(--night)}
.btn-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px}
.myquote{margin-top:16px;font-size:1rem}
.links{list-style:none;padding:0;margin:16px 0 0}
.links li{margin:6px 0}

/* clubs */
section.block{padding:56px 0 8px}
.lead{color:var(--muted);max-width:40em}
.clubs{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:22px;margin-top:22px}
.club{background:#fff;border:2px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:10px}
.club .pic{height:120px;border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.club .pic img{width:100%;height:100%;object-fit:cover}
.club .when{font-size:.9rem;color:var(--muted)}
.club .this{background:var(--paper);border-radius:10px;padding:10px 12px;font-size:1rem}
.club .this b{font-family:var(--display);font-weight:600}
.club .always{font-size:.98rem;border-top:1px dashed var(--line);padding-top:10px}
.club .always a{word-break:break-all}
details.games{margin-top:6px}
details.games summary{cursor:pointer;font-family:var(--display);font-weight:600;color:var(--teal)}
.gamelist{list-style:none;padding:0;margin:10px 0 0}
.gamelist li{padding:10px 0;border-bottom:1px solid var(--line)}
.gamelist .tab{font-size:.85rem;color:var(--muted)}

/* spinner page */
.spin-page{min-height:calc(100vh - 60px);background:var(--night);color:#fff;padding:40px 0 60px;text-align:center}
.dial{margin:24px auto;width:min(320px,80vw);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 50% 45%,var(--night-2),var(--night) 70%);border:10px solid var(--sun);display:flex;align-items:center;justify-content:center;position:relative}
.dial span{font-family:var(--display);font-weight:700;font-size:clamp(5rem,22vw,8rem);color:#fff;font-variant-numeric:tabular-nums}
.dial .tick{position:absolute;top:-22px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:24px solid var(--sun)}
.spin-page > .wrap > p{color:var(--sky)}
.spin-page .card{color:var(--ink)}
.spin-page .btn-ghost{color:#fff;border-color:#fff}

/* quote card */
.card{background:#fff;border-radius:24px;overflow:hidden;max-width:820px;margin:28px auto;text-align:left;color:var(--ink);box-shadow:0 2px 0 var(--line)}
.card-head{display:grid;grid-template-columns:150px 1fr;gap:20px;align-items:center;padding:24px 28px;background:var(--sky)}
.num{font-family:var(--display);font-weight:700;font-size:4.4rem;line-height:1;color:var(--night)}
.num small{display:block;font-size:1rem;font-weight:500}
.card-head h2{margin:0;color:var(--night)}
.card-head .by{font-size:1.05rem;margin-top:4px}
.portrait{float:right;width:min(220px,40%);margin:0 0 14px 22px;border-radius:14px;overflow:hidden;background:var(--paper)}
.portrait figcaption{font-size:.75rem;color:var(--muted);padding:6px 8px}
.mono{float:right;width:120px;height:120px;margin:0 0 14px 22px;border-radius:50%;background:var(--night);color:var(--sun);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:2.6rem}
.card-body{padding:26px 28px}
.passage{font-size:1.32rem;line-height:1.7;white-space:pre-line;margin:0 0 8px}
.passage.poem{white-space:pre-line}
.orig{font-size:1.15rem;line-height:1.65;white-space:pre-line;color:var(--night);margin:0 0 18px;padding-left:14px;border-left:4px solid var(--sun)}
.langlabel{font-size:.9rem;color:var(--muted);margin:0 0 4px}
.card-body h3{margin-top:26px;clear:both}
.defs{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.defs li{background:var(--paper);border-radius:10px;padding:8px 12px}
.defs b{font-weight:700}
.note{font-size:.95rem;color:var(--muted);margin-top:20px}
.card-actions{display:flex;flex-wrap:wrap;gap:12px;padding:0 28px 28px}

/* index */
.qlist{list-style:none;padding:0;margin:20px 0}
.qlist li{display:grid;grid-template-columns:72px 1fr;gap:16px;padding:18px 0;border-bottom:1px solid var(--line)}
.qlist .n{font-family:var(--display);font-weight:700;font-size:2rem;color:var(--night)}
.qlist .t{font-size:1.05rem;white-space:pre-line;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.qlist .who{color:var(--muted);font-size:.95rem;margin:6px 0}
.page{padding:36px 0 60px}
.msg{background:#fff;border:2px dashed var(--line);border-radius:14px;padding:18px;margin:20px 0}
footer{color:var(--muted);font-size:.9rem;padding:40px 0}
@media (max-width:760px){
  .speak-grid{grid-template-columns:1fr}
  .card-head{grid-template-columns:1fr;gap:6px}
  .portrait{float:none;margin:0 0 16px;width:100%}
  .mono{width:64px;height:64px;font-size:1.5rem;margin:0 0 10px 14px}
  .top .wrap{flex-wrap:wrap;row-gap:4px}
  .top nav a{margin:0 14px 0 0;font-size:.9rem}
  .card-head,.card-body{padding-left:20px;padding-right:20px}
  .passage{font-size:1.2rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{.top,.card-actions,footer{display:none}.spin-page{background:#fff}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="#/"><svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2c5 4 7 10 6 17l-6 5-6-5C9 12 11 6 16 2z" fill="#FFC93C"/><circle cx="16" cy="12" r="3" fill="#1D2155"/><path d="M10 19l-4 6 6-2M22 19l4 6-6-2" fill="#BFE6FF"/><path d="M13 25l3 5 3-5z" fill="#FF8A3D"/></svg>Launchpad23 · Ghana</a>
  <nav><a href="#/">This week</a><a href="#/quotes">All quotes</a></nav>
</div></header>
<main id="app" tabindex="-1"><div class="wrap page"><p>Loading…</p></div></main>
<footer><div class="wrap">Launchpad23 · Ghana program. Quotes are checked against their original sources; see "Source" on each card.</div></footer>

<script>
/* ===== Settings ===== */
const SHEET_ID = "1k-s0e-_88iBPJo0j93sIPkA0DlT-gK7n6X1gj1JmMzA";
const IMAGE_FOLDER = "images/";
const STORE_KEY = "lp23-ghana-myquote";

/* ===== Data ===== */
function parseCSV(text){
  const rows=[];let row=[],f="",q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){ if(c=='"'){ if(text[i+1]=='"'){f+='"';i++} else q=false } else f+=c }
    else if(c=='"') q=true;
    else if(c==','){row.push(f);f=""}
    else if(c=='\n'){row.push(f);rows.push(row);row=[];f=""}
    else if(c!='\r') f+=c;
  }
  if(f!==""||row.length){row.push(f);rows.push(row)}
  const head=rows.shift()||[];
  return rows.map(r=>Object.fromEntries(head.map((h,i)=>[h.trim(),(r[i]||"").trim()])));
}
async function tab(name){
  const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&headers=1&sheet=${encodeURIComponent(name)}`;
  const r=await fetch(url); if(!r.ok) throw new Error(name);
  return parseCSV(await r.text());
}
let DATA=null;
async function load(){
  if(DATA) return DATA;
  const names=["Quotes","This Week","Clubs","Games","Speaking Archive","Art Challenges"];
  const res=await Promise.all(names.map(n=>tab(n).catch(()=>[])));
  const quotes=res[0].filter(q=>q["Passage"]&&(q["Show"]||"Yes").toLowerCase()!=="no"&&q["Number"]);
  DATA={quotes,week:res[1],clubs:res[2],games:res[3],archive:res[4],art:res[5]};
  return DATA;
}
function store(n){try{localStorage.setItem(STORE_KEY,String(n))}catch(e){}}
function stored(){try{return localStorage.getItem(STORE_KEY)}catch(e){return null}}

/* ===== Helpers ===== */
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const linkify=s=>esc(s).replace(/(https?:\/\/[^\s)]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
function imgSrc(v){ if(!v) return ""; return /^https?:\/\//.test(v)?v:IMAGE_FOLDER+v; }
function initials(name){ return (name||"?").replace(/\(.*?\)/g,"").split(/[\s,]+/).filter(w=>/^[A-ZÁÉÍÓÚ]/.test(w)).slice(0,2).map(w=>w[0]).join("")||"★"; }
function randomInt(n){ const a=new Uint32Array(1); crypto.getRandomValues(a); return a[0]%n; }
const app=document.getElementById("app");
function view(html){ app.innerHTML=html; window.scrollTo(0,0); }

/* ===== Club artwork (original drawings) ===== */
const ART={
 "public-speaking":`<svg viewBox="0 0 200 120"><rect width="200" height="120" fill="#BFE6FF"/><circle cx="100" cy="52" r="26" fill="#1D2155"/><rect x="92" y="78" width="16" height="22" fill="#1D2155"/><rect x="74" y="98" width="52" height="8" rx="4" fill="#1D2155"/><path d="M140 30q14 22 0 44M152 22q22 30 0 60M60 30q-14 22 0 44M48 22q-22 30 0 60" stroke="#FFC93C" stroke-width="5" fill="none" stroke-linecap="round"/></svg>`,
 "art-club":`<svg viewBox="0 0 200 120"><rect width="200" height="120" fill="#FFE7B0"/><path d="M100 18c-38 0-62 22-62 44s20 34 38 30c10-2 8-14 18-14s18 22 36 10c20-14 32-70-30-70z" fill="#fff" stroke="#1D2155" stroke-width="4"/><circle cx="70" cy="50" r="9" fill="#E8505B"/><circle cx="96" cy="36" r="9" fill="#FFC93C"/><circle cx="126" cy="40" r="9" fill="#0B8A8F"/><circle cx="140" cy="64" r="9" fill="#1D2155"/></svg>`,
 "enchanted-quill":`<svg viewBox="0 0 200 120"><rect width="200" height="120" fill="#E9E4FF"/><rect x="58" y="76" width="40" height="30" rx="6" fill="#1D2155"/><path d="M80 78C100 50 130 26 160 14c-6 30-30 56-72 70z" fill="#fff" stroke="#1D2155" stroke-width="4"/><path d="M84 80l60-56" stroke="#1D2155" stroke-width="3"/><circle cx="150" cy="70" r="3" fill="#FFC93C"/><circle cx="164" cy="56" r="2" fill="#FFC93C"/><circle cx="136" cy="88" r="2.5" fill="#FFC93C"/></svg>`,
 "game-room":`<svg viewBox="0 0 200 120"><rect width="200" height="120" fill="#C9F0E3"/><rect x="44" y="40" width="112" height="52" rx="26" fill="#1D2155"/><rect x="66" y="58" width="22" height="7" rx="2" fill="#fff"/><rect x="73.5" y="50.5" width="7" height="22" rx="2" fill="#fff"/><circle cx="124" cy="56" r="6" fill="#FFC93C"/><circle cx="138" cy="68" r="6" fill="#E8505B"/></svg>`,
 "minecraft":`<svg viewBox="0 0 200 120"><rect width="200" height="120" fill="#D8EFC6"/><g stroke="#1D2155" stroke-width="3"><rect x="50" y="64" width="34" height="34" fill="#C98B4E"/><rect x="84" y="64" width="34" height="34" fill="#9C6A3A"/><rect x="118" y="64" width="34" height="34" fill="#C98B4E"/><rect x="67" y="30" width="34" height="34" fill="#7FBF5A"/><rect x="101" y="30" width="34" height="34" fill="#9C6A3A"/></g></svg>`,
 "geoguessr":`<svg viewBox="0 0 200 120"><rect width="200" height="120" fill="#BFE6FF"/><circle cx="100" cy="64" r="40" fill="#0B8A8F"/><path d="M78 40c10 6 6 16 18 18s4 18 14 24M120 34c-6 10 8 14 4 24" stroke="#C9F0E3" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M132 14c-12 0-20 8-20 19 0 14 20 31 20 31s20-17 20-31c0-11-8-19-20-19z" fill="#E8505B"/><circle cx="132" cy="33" r="6" fill="#fff"/></svg>`,
 "chess":`<svg viewBox="0 0 200 120"><rect width="200" height="120" fill="#F1EEE6"/><g fill="#1D2155"><rect x="30" y="80" width="20" height="20"/><rect x="70" y="80" width="20" height="20"/><rect x="110" y="80" width="20" height="20"/><rect x="150" y="80" width="20" height="20"/><rect x="50" y="100" width="20" height="20"/><rect x="90" y="100" width="20" height="20"/><rect x="130" y="100" width="20" height="20"/></g><path d="M86 76h34v-8h-4c0-12 4-22-2-34-6-10-22-14-30-8l4 6-12 10c-4 4 2 10 6 8l10-4c0 10-6 14-6 22h0z" fill="#FFC93C" stroke="#1D2155" stroke-width="4" stroke-linejoin="round"/></svg>`,
 "harry-potter":`<svg viewBox="0 0 200 120"><rect width="200" height="120" fill="#1D2155"/><path d="M100 96c-18-10-40-10-58-4V34c18-6 40-6 58 4 18-10 40-10 58-4v58c-18-6-40-6-58 4z" fill="#FBFAF6"/><path d="M100 38v58" stroke="#1D2155" stroke-width="3"/><g fill="#FFC93C"><path d="M60 16l3 7 7 1-5 5 1 7-6-4-6 4 1-7-5-5 7-1z"/><circle cx="150" cy="18" r="3"/><circle cx="134" cy="10" r="2"/><circle cx="170" cy="26" r="2"/></g></svg>`,
 "big-think":`<svg viewBox="0 0 200 120"><rect width="200" height="120" fill="#FFE7B0"/><path d="M100 18c-17 0-30 13-30 29 0 11 6 18 12 24 4 4 4 8 4 12h28c0-4 0-8 4-12 6-6 12-13 12-24 0-16-13-29-30-29z" fill="#FFC93C" stroke="#1D2155" stroke-width="4"/><rect x="86" y="86" width="28" height="7" rx="3" fill="#1D2155"/><rect x="89" y="96" width="22" height="7" rx="3" fill="#1D2155"/><rect x="18" y="22" width="40" height="26" rx="8" fill="#fff" stroke="#1D2155" stroke-width="3"/><rect x="142" y="58" width="40" height="26" rx="8" fill="#fff" stroke="#1D2155" stroke-width="3"/></svg>`
};
const STARS=`<svg class="stars" viewBox="0 0 1000 300" preserveAspectRatio="none" aria-hidden="true">${Array.from({length:60},(_,i)=>`<circle cx="${(i*163)%1000}" cy="${(i*97)%300}" r="${1+(i%3)}" fill="#fff"/>`).join("")}</svg>`;

/* ===== Views ===== */
function weekFor(d,key){ return d.week.find(w=>w["Club key (don't change)"]===key)||{}; }
function clubCard(d,c){
  const key=c["Club key (don't change)"]; const w=weekFor(d,key);
  const pic=c["Image"]?`<img src="${esc(imgSrc(c["Image"]))}" alt="">`:(ART[key]||"");
  let thisWeek="";
  if(w["This week"]||w["Link"]){
    thisWeek=`<div class="this"><b>${esc(w["Label"]||"This week")}:</b> ${linkify(w["This week"])}${w["Link"]?` <a href="${esc(w["Link"])}" target="_blank" rel="noopener">${esc(w["Link text"]||"Open")}</a>`:""}</div>`;
  }
  let extra="";
  if(key==="game-room"&&d.games.length){
    extra=`<details class="games"><summary>See all ${d.games.filter(g=>g["Game"]).length} games</summary><ul class="gamelist">${d.games.filter(g=>g["Game"]&&g["Link"]).map(g=>`<li><a href="${esc(g["Link"])}" target="_blank" rel="noopener"><b>${esc(g["Game"])}</b></a><br>${esc(g["What it is"])}${g["Works on a tablet?"]?`<div class="tab">Works on a tablet: ${esc(g["Works on a tablet?"])}</div>`:""}</li>`).join("")}</ul></details>`;
  }
  if(key==="art-club"&&d.art.some(a=>a["Challenge"])) extra+=`<a href="#/art">Past art challenges</a>`;
  return `<article class="club"><div class="pic">${pic}</div><h3>${esc(c["Name"])}</h3><div class="when">${esc(c["When"])}</div><p style="margin:0">${esc(c["Description"])}</p>${thisWeek}${c["Always shown"]?`<div class="always">${linkify(c["Always shown"])}</div>`:""}${extra}</article>`;
}
async function home(){
  const d=await load(); const sp=d.clubs.find(c=>c["Club key (don't change)"]==="public-speaking")||{}; const w=weekFor(d,"public-speaking");
  const mine=stored(); const mq=mine&&d.quotes.find(q=>q["Number"]===mine);
  const others=d.clubs.filter(c=>c["Club key (don't change)"]!=="public-speaking"&&c["Name"]);
  view(`<section class="hero">${STARS}<div class="wrap"><h1>Your week at Launchpad23</h1><p>Everything you need in one place: your public speaking practice and all the Wednesday launches.</p></div></section>
  <div class="wrap"><div class="speak"><div class="speak-grid"><div>
    <h2>${esc(sp["Name"]||"Public Speaking")}</h2><p>${esc(sp["Description"]||"")}</p>
    ${w["This week"]?`<div class="week"><b>${esc(w["Label"]||"This week")}</b>${linkify(w["This week"])}${w["Link"]?` <a href="${esc(w["Link"])}" target="_blank" rel="noopener">${esc(w["Link text"]||"Open")}</a>`:""}</div>`:""}
    <div class="btn-row"><a class="btn btn-sun" href="#/spin">Spin for a quote</a><a class="btn btn-ghost" href="#/quotes">See all quotes</a></div>
    ${mq?`<p class="myquote">Your last quote: <a href="#/quote/${esc(mq["Number"])}">Number ${esc(mq["Number"])}, ${esc(mq["Title"])}</a></p>`:""}
  </div><div>${ART["public-speaking"]}
    <ul class="links">${d.archive.some(a=>a["Title"])?`<li><a href="#/archive">Past public speaking materials</a></li>`:""}<li><a href="#/quotes">Practise any quote</a></li></ul></div></div></div>
  <section class="block"><h2>Wednesday launches</h2><p class="lead">Choose a club and dive in. Each one has something new every week.</p>
  <div class="clubs">${others.map(c=>clubCard(d,c)).join("")}</div></section></div>`);
}
function cardHTML(q){
  const defs=(q["Helpful definitions (one per line)"]||"").split("\n").map(s=>s.trim()).filter(Boolean).map(s=>{const i=s.indexOf(":");return i>0?`<li><b>${esc(s.slice(0,i))}</b>: ${esc(s.slice(i+1).trim())}</li>`:`<li>${esc(s)}</li>`}).join("");
  const img=q["Image"]?`<figure class="portrait"><img src="${esc(imgSrc(q["Image"]))}" alt="${esc(q["Speaker"])}">${q["Image credit"]?`<figcaption>${esc(q["Image credit"])}</figcaption>`:""}</figure>`:`<div class="mono" aria-hidden="true">${esc(initials(q["Speaker"]))}</div>`;
  const orig=q["Original text"]?`<p class="langlabel">${esc(q["Original language"]||"Original")}</p><p class="orig" lang="${(q["Original language"]||"").toLowerCase().startsWith("span")?"es":""}">${esc(q["Original text"])}</p><p class="langlabel">English</p>`:"";
  return `<article class="card"><div class="card-head"><div class="num"><small>Quote</small>${esc(q["Number"])}</div><div><h2>${esc(q["Title"])}</h2><div class="by">${esc(q["Speaker"])}${q["Year"]?`, ${esc(q["Year"])}`:""}</div>${q["Where / from"]?`<div class="by" style="font-size:.95rem">${esc(q["Where / from"])}</div>`:""}</div></div>
  <div class="card-body">${img}${orig}<p class="passage">${esc(q["Passage"])}</p>
  ${q["Background"]?`<h3>The story behind it</h3><p>${esc(q["Background"])}</p>`:""}
  ${defs?`<h3>Helpful definitions</h3><ul class="defs">${defs}</ul>`:""}
  ${q["Source"]?`<p class="note">Source: <a href="${esc(q["Source"])}" target="_blank" rel="noopener">original text</a></p>`:""}</div>`;
}
async function quote(n){
  const d=await load(); const q=d.quotes.find(x=>x["Number"]===n);
  if(!q){ view(`<div class="wrap page"><div class="msg">There is no quote number ${esc(n)} yet. <a href="#/quotes">See all quotes</a>.</div></div>`); return; }
  view(`<div class="wrap page">${cardHTML(q)}<div class="card-actions" style="max-width:820px;margin:0 auto"><a class="btn btn-sun" href="#/spin">Spin again</a><a class="btn btn-ghost" href="#/quotes">See all quotes</a></div></div>`);
}
async function spin(){
  const d=await load();
  if(!d.quotes.length){ view(`<div class="wrap page"><div class="msg">No quotes yet. Add some to the Quotes tab of the spreadsheet.</div></div>`); return; }
  view(`<div class="spin-page"><div class="wrap"><h1>Spin for your quote</h1><p>Press the button. Your number is your quote.</p>
  <div class="dial" aria-live="polite"><div class="tick"></div><span id="dialnum">?</span></div>
  <button class="btn btn-sun" id="go">Spin</button>
  <div id="result"></div></div></div>`);
  const btn=document.getElementById("go"), num=document.getElementById("dialnum");
  btn.onclick=()=>{
    btn.disabled=true; document.getElementById("result").innerHTML="";
    const pick=d.quotes[randomInt(d.quotes.length)];
    const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
    let t=0, steps=reduce?1:26;
    const tick=()=>{
      t++;
      if(!document.getElementById("result")) return;
      if(t<steps){ num.textContent=d.quotes[randomInt(d.quotes.length)]["Number"]; setTimeout(tick,30+t*t*0.4); }
      else{ num.textContent=pick["Number"]; store(pick["Number"]); btn.disabled=false; btn.textContent="Spin again";
        history.replaceState(null,"","#/spin/"+pick["Number"]);
        document.getElementById("result").innerHTML=cardHTML(pick)+`<p><a class="btn btn-ghost" href="#/quote/${esc(pick["Number"])}">Open just this card</a></p>`;
        document.querySelector("#result .card").scrollIntoView({behavior:reduce?"auto":"smooth",block:"start"}); }
    }; tick();
  };
}
async function list(){
  const d=await load();
  view(`<div class="wrap page"><h1>All quotes</h1><p class="lead">Every quote has a number. Find yours, or pick any one to practise.</p>
  <ul class="qlist">${d.quotes.map(q=>`<li><div class="n">${esc(q["Number"])}</div><div><div class="t">${esc(q["Passage"])}</div><div class="who">${esc(q["Speaker"])}${q["Year"]?`, ${esc(q["Year"])}`:""}</div><a href="#/quote/${esc(q["Number"])}">More information</a></div></li>`).join("")}</ul></div>`);
}
async function archive(kind){
  const d=await load(); const rows=(kind==="art"?d.art:d.archive).filter(r=>r[kind==="art"?"Challenge":"Title"]);
  view(`<div class="wrap page"><h1>${kind==="art"?"Past art challenges":"Past public speaking materials"}</h1>
  ${rows.length?`<ul class="qlist">${rows.map(r=>`<li><div class="n" style="font-size:1rem">${esc(r["Date"])}</div><div><b>${esc(r[kind==="art"?"Challenge":"Title"])}</b><p style="margin:4px 0">${esc(r["Description"])}</p>${r["Link"]?`<a href="${esc(r["Link"])}" target="_blank" rel="noopener">Open</a>`:""}</div></li>`).join("")}</ul>`:`<div class="msg">Nothing here yet.</div>`}
  <a href="#/">Back to this week</a></div>`);
}
async function route(){
  const h=location.hash.replace(/^#\/?/,"");
  try{
    if(h.startsWith("quote/")) await quote(h.split("/")[1]);
    else if(h==="spin") await spin();
    else if(h.startsWith("spin/")) await quote(h.split("/")[1]);
    else if(h==="quotes") await list();
    else if(h==="archive") await archive("speaking");
    else if(h==="art") await archive("art");
    else await home();
  }catch(e){ view(`<div class="wrap page"><div class="msg">The page could not load its content. Check your internet connection, then refresh the page.</div></div>`); }
  app.focus({preventScroll:true});
}
addEventListener("hashchange",route); route();
</script>
